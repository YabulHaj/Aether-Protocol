<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02050c">
<title>AETHER · LIVE RIVER</title>
<style>
:root{
  --bg:#02050c;
  --ink:#e5f3ff;
  --muted:#6f87a2;
  --line:rgba(145,190,230,.11);
  --cyan:#59dcff;
  --violet:#9b8cff;
  --green:#3cf0be;
  --red:#ff5b73;
  --amber:#ffd26d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
body:after{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:20;
  background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 18%,transparent 82%,rgba(255,255,255,.012));
  mix-blend-mode:screen;
}
.top{
  position:fixed;inset:0 0 auto 0;height:58px;z-index:30;
  display:flex;align-items:center;gap:15px;padding:0 18px;
  background:linear-gradient(180deg,rgba(2,5,12,.95),rgba(2,5,12,.42),transparent);
  pointer-events:none
}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:31px;height:31px;object-fit:contain;filter:drop-shadow(0 0 9px rgba(89,220,255,.28))}
.brandText{font-size:10px;letter-spacing:.28em;font-weight:800}
.brandSub{font-size:8px;letter-spacing:.2em;color:#526b84;margin-left:-6px}
.spacer{flex:1}
.status{
  display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;
  border:1px solid rgba(145,190,230,.10);background:rgba(5,12,23,.48);
  color:#86a0b8;font-size:8px;letter-spacing:.16em
}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 9px var(--amber)}
.status.live{color:#a8fee4;border-color:rgba(60,240,190,.18)}
.status.live .dot{background:var(--green);box-shadow:0 0 10px var(--green)}
.status.offline{color:#ffacb9;border-color:rgba(255,91,115,.18)}
.status.offline .dot{background:var(--red);box-shadow:0 0 10px var(--red)}
.stat{font-size:8px;letter-spacing:.12em;color:#607a95;font-variant-numeric:tabular-nums}
.stat b{color:var(--cyan);font-weight:700}
.counts{display:flex;gap:9px;font-size:8px;letter-spacing:.10em;font-variant-numeric:tabular-nums}
.counts .g{color:var(--green)} .counts .r{color:var(--red)}
.reconnect{
  width:27px;height:27px;border:1px solid rgba(145,190,230,.12);border-radius:50%;
  background:rgba(7,16,30,.55);color:#86a2be;font-size:13px
}
.reconnect:hover{color:var(--cyan);border-color:rgba(89,220,255,.4);box-shadow:0 0 12px rgba(89,220,255,.18)}
.reconnect.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.leftRail{
  position:fixed;left:17px;top:18%;bottom:18%;z-index:15;
  display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;
  pointer-events:none
}
.gate{
  display:flex;align-items:center;gap:7px;color:#405872;font-size:7px;letter-spacing:.22em;
  transition:color .2s ease, text-shadow .2s ease
}
.gate:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);opacity:.45}
.gate.hot{color:#dcecff;text-shadow:0 0 12px rgba(255,255,255,.15)}
.gate.hot:before{opacity:1;box-shadow:0 0 16px var(--c)}

.rightPanel{
  position:fixed;right:16px;top:76px;width:min(312px,31vw);z-index:25;
  pointer-events:none
}
.panel{
  border:1px solid rgba(145,190,230,.09);
  background:linear-gradient(180deg,rgba(5,12,24,.72),rgba(4,10,20,.40));
  border-radius:14px;padding:11px 12px;
  box-shadow:0 12px 40px rgba(0,0,0,.20)
}
.panelTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.panelTitle span{font-size:8px;letter-spacing:.18em;color:#59718d}
.panelTitle b{font-size:7px;letter-spacing:.16em;color:var(--cyan);font-weight:700}
.decision{display:flex;align-items:center;gap:9px}
.decisionDot{width:7px;height:7px;border-radius:50%;background:#49627c}
.decisionDot.green{background:var(--green);box-shadow:0 0 12px var(--green)}
.decisionDot.red{background:var(--red);box-shadow:0 0 12px var(--red)}
.decisionWord{font-size:12px;letter-spacing:.14em;font-weight:800}
.decisionWord.green{color:var(--green)} .decisionWord.red{color:var(--red)}
.eventGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kv{min-width:0}
.kv small{display:block;font-size:6px;letter-spacing:.16em;color:#46607b;margin-bottom:3px}
.kv div{font-size:9px;color:#b8cce0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reason{margin-top:9px;padding-top:8px;border-top:1px solid rgba(145,190,230,.07);font-size:8px;line-height:1.4;color:#7590aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hash{margin-top:7px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:7px;color:#4c708d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.feed{
  position:fixed;right:16px;bottom:46px;width:min(312px,31vw);z-index:25;pointer-events:none
}
.feedTitle{font-size:7px;letter-spacing:.18em;color:#425b75;margin-bottom:5px}
.feedRows{display:flex;flex-direction:column;gap:4px}
.row{
  display:grid;grid-template-columns:6px 1fr auto auto;gap:8px;align-items:center;
  padding:6px 8px;border-radius:8px;background:rgba(5,12,24,.44);
  border:1px solid rgba(145,190,230,.06)
}
.row .dot{width:5px;height:5px;border-radius:50%;background:var(--red);box-shadow:0 0 7px var(--red)}
.row.green .dot{background:var(--green);box-shadow:0 0 7px var(--green)}
.row .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#adc4da;font-size:8px}
.row .op{color:#58728d;font-size:7px}
.row .verdict{font-size:7px;font-weight:800;letter-spacing:.12em;color:var(--red)}
.row.green .verdict{color:var(--green)}

.bottomBar{
  position:fixed;left:17px;right:17px;bottom:15px;z-index:25;
  display:flex;align-items:center;gap:12px;pointer-events:none
}
.meta{font-size:7px;letter-spacing:.14em;color:#3d566e}
.meta b{color:#6f8aa2;font-weight:600}
.meter{flex:1;height:3px;background:rgba(120,155,190,.08);overflow:hidden;border-radius:999px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(89,220,255,.2),rgba(60,240,190,.7));box-shadow:0 0 10px rgba(60,240,190,.35)}
.load{min-width:74px;text-align:right;font-size:7px;letter-spacing:.12em;color:#3f5871}

@media(max-width:850px){
  .rightPanel,.feed{width:35vw}
  .brandSub,.stat{display:none}
}
@media(max-width:700px){
  .rightPanel,.feed{display:none}
  .leftRail{left:9px}
  .counts{display:none}
  .bottomBar{left:10px;right:10px}
}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<header class="top">
  <div class="brand">
  <img src="./aether-logo.png" alt="Aether">
  <span class="brandText">AETHER</span>
  <span class="brandSub">LIVE RIVER</span>
  </div>
  <div class="spacer"></div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">CONNECTING</span></div>
  <div class="stat">RATE <b id="rate">0.0</b>/s</div>
  <div class="counts"><span class="g" id="allowCt">0</span><span class="r" id="denyCt">0</span></div>
  <button class="reconnect" id="reconnect" title="Reconnect">↻</button>
</header>

<aside class="leftRail" id="gates"></aside>

<section class="rightPanel">
  <div class="panel">
    <div class="panelTitle">
      <span>AUTHORIZATION EVENT</span>
      <b id="streamLabel">LIVE</b>
    </div>
    <div class="decision">
      <span class="decisionDot" id="decisionDot"></span>
      <span class="decisionWord" id="decisionWord">WAITING</span>
    </div>
    <div class="eventGrid">
      <div class="kv"><small>IDENTITY</small><div id="identity">—</div></div>
      <div class="kv"><small>INTENT</small><div id="intent">—</div></div>
      <div class="kv"><small>CAPABILITY</small><div id="capability">—</div></div>
      <div class="kv"><small>OPERATION</small><div id="operation">—</div></div>
      <div class="kv" style="grid-column:1/3"><small>TARGET</small><div id="target">—</div></div>
    </div>
    <div class="reason" id="reason">Waiting for real Aether telemetry.</div>
    <div class="hash" id="hash">EVIDENCE HASH · —</div>
  </div>
</section>

<section class="feed">
  <div class="feedTitle">RECENT DECISIONS</div>
  <div class="feedRows" id="feedRows"></div>
</section>

<div class="bottomBar">
  <div class="meta">STREAM <b id="streamCount">0</b></div>
  <div class="meta">VISUAL <b id="visualCount">0</b></div>
  <div class="meter"><i id="loadMeter"></i></div>
  <div class="load" id="loadText">VISUAL LOAD 0</div>
</div>

<script>
(() => {
'use strict';

/*
  AETHER LIVE RIVER — SIMPLE FREE EDITION

  Real SSE telemetry only.
  No synthetic events.
  No fake agents.
  No authorization decisions made by the browser.

  Performance rules:
  - cap device pixel ratio at 1.25
  - bounded particle pools
  - process only a few pending visuals per frame
  - update DOM in batches
  - keep recent feed tiny
  - never create an element per incoming event
*/

const GATEWAY = '/v1/events';

const MAX_DROPS = 140;
const MAX_SPARKS = 180;
const MAX_RIPPLES = 55;
const MAX_SEDIMENT = 120;
const MAX_PENDING = 260;
const VISUALS_PER_FRAME = 7;
const MAX_FEED = 6;
const BACKOFF = [1000,2000,4000,8000,15000];
const TAU = Math.PI * 2;

const GATES = [
  {name:'IDENTITY',    c:[89,220,255]},
  {name:'INTENT',      c:[155,140,255]},
  {name:'POLICY',      c:[255,210,109]},
  {name:'REVOCATION',  c:[255,105,160]},
  {name:'ENFORCEMENT', c:[112,178,255]},
  {name:'EVIDENCE',    c:[60,240,190]}
];

const BAND_Y = GATES.map((_,i) => .16 + i*.132);

const state = {
  connection:'connecting',
  attempts:0,
  stream:0,
  allowed:0,
  denied:0,
  visualized:0,
  sampled:0,
  queueGreen:[],
  queueRed:[],
  drops:[],
  sparks:[],
  ripples:[],
  sediment:[],
  history:[],
  feed:[],
  recent:[],
  gateFlash:new Array(GATES.length).fill(0),
  last:null
};

let W=0,H=0,dpr=1,es=null,reconnectTimer=null,flushTimer=null;

const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d',{alpha:true,desynchronized:true});
const gateRoot=document.getElementById('gates');
const feedRoot=document.getElementById('feedRows');

function clamp(v,a,b){return v<a?a:v>b?b:v}
function rgba(c,a){return `rgba(${c[0]},${c[1]},${c[2]},${a})`}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,1.25);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function buildGates(){
  gateRoot.replaceChildren();
  GATES.forEach((g,i)=>{
    const el=document.createElement('div');
    el.className='gate';
    el.textContent=g.name;
    el.style.setProperty('--c',`rgb(${g.c.join(',')})`);
    gateRoot.appendChild(el);
  });
}

function gateFlash(i){
  const el=gateRoot.children[i];
  if(!el) return;
  state.gateFlash[i]=1;
  el.classList.add('hot');
  clearTimeout(el._timer);
  el._timer=setTimeout(()=>el.classList.remove('hot'),150);
}

function ingest(raw){
  if(!raw || typeof raw!=='object') return;

  const status = Number(raw.status);

  const allowed =
    raw.allowed === true ||
    String(raw.allowed).toLowerCase() === 'true' ||
    status === 200 ||
    String(raw.result || '').toUpperCase() === 'ALLOWED' ||
    String(raw.result || '').toUpperCase() === 'ALLOW' ||
    String(raw.decision || '').toUpperCase() === 'ALLOWED' ||
    String(raw.decision || '').toUpperCase() === 'ALLOW';

  const evt={
    allowed,
    identity:raw.identity||'unknown.agent',
    intent:raw.intent||'—',
    capability:raw.capability||'—',
    target:raw.target||'—',
    operation:raw.operation||'invoke',
    reason:raw.reason||raw.message||(allowed?'allowed':'denied'),
    hash:raw.hash||'',
    scenario:raw.scenario_id||'',
    time:Date.now()
  };

  state.stream++;

  if(allowed) state.allowed++;
  else state.denied++;

  state.last=evt;

  state.history.push(allowed?1:0);
  if(state.history.length>520) state.history.shift();

  state.recent.push(evt.time);
  if(state.recent.length>900) state.recent.splice(0,300);

  state.feed.unshift(evt);
  if(state.feed.length>MAX_FEED) state.feed.pop();

  const visualQueue =
    allowed ? state.queueGreen : state.queueRed;

  if(visualQueue.length < MAX_PENDING/2){
    visualQueue.push(evt);
  }else{
    state.sampled++;
  }

  updateInspector(evt);
  scheduleFeedFlush();
}

function updateInspector(evt){
  const dot=document.getElementById('decisionDot');
  const word=document.getElementById('decisionWord');

  dot.className='decisionDot '+(evt.allowed?'green':'red');
  word.className='decisionWord '+(evt.allowed?'green':'red');
  word.textContent=evt.allowed?'ALLOWED':'BLOCKED';

  document.getElementById('identity').textContent=evt.identity;
  document.getElementById('intent').textContent=evt.intent;
  document.getElementById('capability').textContent=evt.capability;
  document.getElementById('operation').textContent=evt.operation;
  document.getElementById('target').textContent=evt.target;
  document.getElementById('reason').textContent=evt.reason;
  document.getElementById('hash').textContent=
    'EVIDENCE HASH · '+(evt.hash||'not supplied');
}

function scheduleFeedFlush(){
  if(flushTimer) return;
  flushTimer=setTimeout(()=>{
    flushTimer=null;
    renderFeed();
    updateStats();
  },90);
}

function spawn(evt){
  if(state.drops.length>=MAX_DROPS){
    state.sampled++;
    return;
  }

  state.drops.push({
    x:.47+Math.random()*.06,
    y:-.05,
    vy:.18+Math.random()*.05,
    drift:(Math.random()-.5)*.025,
    allowed:evt.allowed,
    color:evt.allowed?[60,240,190]:[255,80,110],
    failAt:evt.allowed?-1:1+Math.floor(Math.random()*4),
    lastBand:-1
  });

  state.visualized++;
}

function processQueue(){
  let remaining = VISUALS_PER_FRAME;
  let greenTurn = true;

  while(remaining > 0 && (state.queueGreen.length || state.queueRed.length)){
    let evt = null;

    if(greenTurn && state.queueGreen.length){
      evt = state.queueGreen.shift();
    }else if(!greenTurn && state.queueRed.length){
      evt = state.queueRed.shift();
    }else if(state.queueGreen.length){
      evt = state.queueGreen.shift();
    }else{
      evt = state.queueRed.shift();
    }

    if(evt) spawn(evt);

    greenTurn = !greenTurn;
    remaining--;
  }
}

function shatter(d){
  const count=Math.min(
    8,
    MAX_SPARKS-state.sparks.length
  );

  const x=d.x*W, y=d.y*H;

  for(let i=0;i<count;i++){
    const a=Math.random()*TAU;
    const sp=20+Math.random()*85;
    state.sparks.push({
      x,y,
      vx:Math.cos(a)*sp,
      vy:Math.sin(a)*sp-22,
      life:.42+Math.random()*.32,
      max:.74,
      color:d.color
    });
  }

  if(state.ripples.length<MAX_RIPPLES){
    state.ripples.push({
      x:d.x,y:d.y,r:.005,max:.07,life:1,color:d.color
    });
  }
}

function deposit(d){
  if(state.sediment.length>=MAX_SEDIMENT) state.sediment.shift();

  state.sediment.push({
    x:d.x,
    life:1,
    color:d.color
  });

  if(state.ripples.length<MAX_RIPPLES){
    state.ripples.push({
      x:d.x,y:.945,r:.005,max:.065,life:1,color:d.color
    });
  }
}

function update(dt){
  processQueue();

  for(let i=0;i<GATES.length;i++)
    state.gateFlash[i]=Math.max(0,state.gateFlash[i]-dt*3.2);

  for(let i=state.drops.length-1;i>=0;i--){
    const d=state.drops[i];

    d.y+=d.vy*dt;
    d.x+=d.drift*dt;

    const band=Math.floor(d.y/.132);

    if(
      band>=0 &&
      band<GATES.length &&
      band>d.lastBand
    ){
      d.lastBand=band;
      gateFlash(band);

      if(!d.allowed && band===d.failAt){
        shatter(d);
        state.drops.splice(i,1);
        continue;
      }
    }

    if(d.y>.95){
      if(d.allowed) deposit(d);
      state.drops.splice(i,1);
    }
  }

  for(let i=state.sparks.length-1;i>=0;i--){
    const p=state.sparks[i];
    p.life-=dt;
    if(p.life<=0){
      state.sparks.splice(i,1);
      continue;
    }
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=28*dt;
    p.vx*=Math.pow(.2,dt);
  }

  for(let i=state.ripples.length-1;i>=0;i--){
    const r=state.ripples[i];
    r.life-=dt*1.7;
    if(r.life<=0) state.ripples.splice(i,1);
  }

  for(const s of state.sediment)
    s.life=Math.max(.25,s.life-dt*.028);
}

function drawBackground(t){
  const g=ctx.createRadialGradient(
    W*.50,H*.48,0,
    W*.50,H*.48,Math.max(W,H)*.62
  );
  g.addColorStop(0,'rgba(24,64,140,.12)');
  g.addColorStop(.46,'rgba(11,29,63,.045)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  const beam=ctx.createLinearGradient(0,0,0,H);
  beam.addColorStop(0,'rgba(89,220,255,0)');
  beam.addColorStop(.5,'rgba(89,220,255,.028)');
  beam.addColorStop(1,'rgba(60,240,190,.02)');
  ctx.fillStyle=beam;
  ctx.fillRect(W*.43,0,W*.14,H);

  /* Cheap ambient stars. Deterministic positions; no growing arrays. */
  ctx.fillStyle='rgba(176,220,255,.035)';
  for(let i=0;i<34;i++){
    const x=(i*83.17+(t*.004*(i%3+1)))%W;
    const y=(i*47.31+(t*.009*(i%4+1)))%H;
    ctx.fillRect(x,y,1,1);
  }
}

function drawGates(t){
  for(let i=0;i<GATES.length;i++){
    const g=GATES[i];
    const y=BAND_Y[i]*H;
    const f=state.gateFlash[i];
    const pulse=.5+.5*Math.sin(t*.001+i);

    ctx.strokeStyle=rgba(
      g.c,
      .075+.03*pulse+f*.32
    );
    ctx.lineWidth=.55+f*1.15;

    ctx.beginPath();
    ctx.moveTo(0,y+.5);
    ctx.lineTo(W,y+.5);
    ctx.stroke();

    if(f>.12){
      ctx.fillStyle=rgba(g.c,f*.035);
      ctx.fillRect(0,y-18,W,36);
    }
  }
}

function drawSediment(){
  for(const s of state.sediment){
    const x=s.x*W;
    ctx.fillStyle=rgba(s.color,.10*s.life);
    ctx.beginPath();
    ctx.arc(x,H*.95,3.5*s.life,0,TAU);
    ctx.fill();
  }
}

function drawRipples(){
  for(const r of state.ripples){
    const rad=(r.r+(r.max-r.r)*(1-r.life))*Math.min(W,H);
    ctx.strokeStyle=rgba(r.color,r.life*.28);
    ctx.lineWidth=.9+.9*r.life;
    ctx.beginPath();
    ctx.arc(r.x*W,r.y*H,rad,0,TAU);
    ctx.stroke();
  }
}

function drawDrops(){
  for(const d of state.drops){
    const x=d.x*W, y=d.y*H;

    if(d.allowed){
      /*
        ALLOWED = a visible, clean authorization current.
        It gets a soft comet trail and a bright core, but no
        extra objects are allocated.
      */
      ctx.strokeStyle=rgba(d.color,.46);
      ctx.lineWidth=1.15;
      ctx.beginPath();
      ctx.moveTo(x,y-34);
      ctx.lineTo(x,y+2);
      ctx.stroke();

      ctx.fillStyle=rgba(d.color,.10);
      ctx.beginPath();
      ctx.arc(x,y,17,0,TAU);
      ctx.fill();

      ctx.strokeStyle=rgba(d.color,.42);
      ctx.lineWidth=.8;
      ctx.beginPath();
      ctx.arc(x,y,8.5,0,TAU);
      ctx.stroke();

      ctx.fillStyle='rgba(220,255,246,.95)';
      ctx.beginPath();
      ctx.arc(x,y,2.8,0,TAU);
      ctx.fill();

    }else{
      /*
        BLOCKED = compact red signal that reaches its gate
        and then shatters. Red remains visually distinct.
      */
      ctx.strokeStyle=rgba(d.color,.38);
      ctx.lineWidth=.9;
      ctx.beginPath();
      ctx.moveTo(x,y-15);
      ctx.lineTo(x,y);
      ctx.stroke();

      ctx.fillStyle=rgba(d.color,.18);
      ctx.beginPath();
      ctx.arc(x,y,11,0,TAU);
      ctx.fill();

      ctx.fillStyle='rgba(255,235,240,.94)';
      ctx.beginPath();
      ctx.arc(x,y,2.5,0,TAU);
      ctx.fill();
    }
  }
}

function drawSparks(){
  for(const p of state.sparks){
    const a=clamp(p.life/p.max,0,1);
    ctx.fillStyle=rgba(p.color,a*.65);
    ctx.fillRect(p.x,p.y,1.5+a*2,1.5+a*2);
  }
}

function drawHistory(){
  const y=H-7;
  const n=state.history.length;
  if(!n)return;

  const bw=Math.max(1,W/520);

  for(let i=0;i<n;i++){
    const x=W-(n-i)*bw;
    ctx.fillStyle=state.history[i]
      ?'rgba(60,240,190,.52)'
      :'rgba(255,80,110,.52)';
    ctx.fillRect(x,y,bw+.15,3);
  }
}

function render(t){
  ctx.clearRect(0,0,W,H);
  drawBackground(t);
  drawGates(t);
  ctx.globalCompositeOperation='lighter';
  drawSediment();
  drawRipples();
  drawDrops();
  drawSparks();
  ctx.globalCompositeOperation='source-over';
  drawHistory();
}

function frame(t){
  const dt=Math.min((t-lastFrame)/1000||0,.05);
  lastFrame=t;
  update(dt);
  render(t);
  requestAnimationFrame(frame);
}

let lastFrame=performance.now();

function setConnection(kind){
  state.connection=kind;

  const el=document.getElementById('status');
  const text=document.getElementById('statusText');

  el.classList.remove('live','offline');

  if(kind==='live'){
    el.classList.add('live');
    text.textContent='LIVE';
    document.getElementById('streamLabel').textContent='REAL SSE';
  }else if(kind==='offline'){
    el.classList.add('offline');
    text.textContent='DISCONNECTED';
    document.getElementById('streamLabel').textContent='DISCONNECTED';
  }else{
    text.textContent=kind.toUpperCase();
    document.getElementById('streamLabel').textContent='CONNECTING';
  }
}

function scheduleReconnect(){
  if(reconnectTimer)return;

  state.attempts++;
  setConnection('offline');

  const delay=BACKOFF[
    Math.min(state.attempts-1,BACKOFF.length-1)
  ];

  document.getElementById('reconnect').classList.add('spin');

  reconnectTimer=setTimeout(()=>{
    reconnectTimer=null;
    connect(true);
  },delay);
}

function connect(retry=false){
  if(es){
    try{es.close()}catch(_){}
    es=null;
  }

  if(!retry) state.attempts=0;

  setConnection(retry?'offline':'connecting');

  try{
    es=new EventSource(GATEWAY);
  }catch(_){
    scheduleReconnect();
    return;
  }

  es.onopen=()=>{
    state.attempts=0;
    setConnection('live');
    document.getElementById('reconnect').classList.remove('spin');
  };

  es.onmessage=(msg)=>{
    if(!msg.data)return;
    try{
      ingest(JSON.parse(msg.data));
    }catch(_){}
  };

  es.onerror=()=>{
    try{es.close()}catch(_){}
    es=null;
    scheduleReconnect();
  };
}

document.getElementById('reconnect').addEventListener('click',()=>{
  if(reconnectTimer){
    clearTimeout(reconnectTimer);
    reconnectTimer=null;
  }
  document.getElementById('reconnect').classList.add('spin');
  connect(false);
});

window.addEventListener('resize',resize,{passive:true});

buildGates();
resize();
renderFeed();
updateStats();
connect(false);

setInterval(updateStats,300);
requestAnimationFrame(frame);

function renderFeed(){
  const frag=document.createDocumentFragment();

  for(const evt of state.feed){
    const row=document.createElement('div');
    row.className='row '+(evt.allowed?'green':'red');

    const d=document.createElement('span');
    d.className='dot';

    const who=document.createElement('span');
    who.className='who';
    who.textContent=evt.identity;
    who.title=evt.identity;

    const op=document.createElement('span');
    op.className='op';
    op.textContent=evt.operation;

    const v=document.createElement('span');
    v.className='verdict';
    v.textContent=evt.allowed?'ALLOW':'DENY';

    row.append(d,who,op,v);
    frag.appendChild(row);
  }

  feedRoot.replaceChildren(frag);
}

function updateStats(){
  const now=Date.now();

  while(state.recent.length && now-state.recent[0]>3000)
    state.recent.shift();

  document.getElementById('rate').textContent=(state.recent.length/3).toFixed(1);
  document.getElementById('allowCt').textContent=state.allowed.toLocaleString();
  document.getElementById('denyCt').textContent=state.denied.toLocaleString();
  document.getElementById('streamCount').textContent=state.stream.toLocaleString();
  document.getElementById('visualCount').textContent=state.visualized.toLocaleString();

  const load=Math.min(
    100,
    state.drops.length/MAX_DROPS*78+
    (state.queueGreen.length+state.queueRed.length)/MAX_PENDING*22
  );

  document.getElementById('loadMeter').style.width=load.toFixed(1)+'%';
  document.getElementById('loadText').textContent=
    'VISUAL LOAD '+state.drops.length+
    (state.sampled?' · SAMPLED':'');
}
})();
</script>
